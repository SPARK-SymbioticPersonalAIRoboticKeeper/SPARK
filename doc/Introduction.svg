<title id="title">pArc Introduction — three primary principles, iterative V-model and complete agent handover</title>
<desc id="desc">A4 landscape introduction to pArc. Three primary principles explicitly named Symmetric V-Model, Machine-Oriented Deliverables, Complete Phase Deliverables. Within-stage recursion, SWE2 architecture gate, artifact-based SWE2-SWE3-SWE4 handovers and supporting P4-P10 bedrock. Automotive SPICE inspired numbering only.</desc>
